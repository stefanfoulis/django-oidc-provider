name: Django Tests CI

on:
  push:
    branches: ["master", "develop"]
  pull_request:
    branches: ["develop"]

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
        test: ['django41', 'django42', 'django50', 'django51']
        include:
          - python-version: '3.11'
            test: 'flake8'
          - python-version: '3.11'
            test: 'docs'
          - python-version: '3.8'
            test: 'django32'
          - python-version: '3.8'
            test: 'django40'
          - python-version: '3.9'
            test: 'django32'
          - python-version: '3.9'
            test: 'django40'
          - python-version: '3.10'
            test: 'django32'
          - python-version: '3.10'
            test: 'django40'
            
    steps:
    - uses: actions/checkout@v3
    - uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install tox tox-gh-actions
    - name: Run tox
      run: tox
      env:
        TOXENV: ${{ matrix.test }}
